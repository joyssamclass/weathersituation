<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘은 어떤 날? · 날씨 상황 뽑기</title>
<style>
:root{--ink:#172d50;--blue:#2465ed;--sky:#e9f5ff;--yellow:#ffcf4b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0,#fff7d3,transparent 40%),linear-gradient(130deg,#ecf7ff,#f0f3ff);color:var(--ink);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:4px solid #ffb600;outline-offset:4px}header{max-width:1450px;margin:auto;padding:24px 36px 14px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-weight:800;font-size:16px;letter-spacing:.05em}.tools{display:flex;gap:8px}.small{border:1px solid #d2deef;background:#ffffffcc;border-radius:14px;padding:10px 14px;color:var(--ink);font-size:14px}.small:hover{background:#fff}main{max-width:1450px;margin:auto;padding:12px 36px 24px}.intro{text-align:center}.eyebrow{display:inline-block;background:#fff4c9;border-radius:40px;padding:7px 18px;font-size:14px;font-weight:bold;color:#7b5c06}h1{font-size:clamp(32px,3.6vw,54px);letter-spacing:-.06em;margin:12px 0}h1 span{color:var(--blue)}.intro p{margin:0;color:#64758c;font-size:17px}.layout{display:grid;grid-template-columns:390px 1fr;gap:28px;margin-top:28px;align-items:stretch}.machine-side{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:#ffffff80;border:1px solid white;border-radius:32px}.machine{width:290px;position:relative}.globe{height:245px;border:9px solid white;border-radius:48% 48% 38% 38%;background:linear-gradient(140deg,#ffffffdc,#cbe8ff9c);box-shadow:inset 0 0 0 3px #a3c8ed,0 12px 24px #164f8a12;position:relative;overflow:hidden}.globe:after{content:'';position:absolute;left:30px;top:25px;height:75px;width:22px;background:white;opacity:.8;border-radius:50%;transform:rotate(30deg)}.ball{position:absolute;width:57px;height:57px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:27px;box-shadow:inset -5px -7px 0 #0000000b,0 5px 8px #183a6320;left:var(--x);top:var(--y);transition:opacity .3s}.ball.used{opacity:.16}.mix .ball{animation:tumble .4s ease-in-out infinite alternate;animation-delay:var(--d)}@keyframes tumble{to{transform:translate(var(--dx),var(--dy)) rotate(150deg)}}.base{margin:-10px 15px 0;background:linear-gradient(135deg,#3778f7,#2255d0);height:113px;border:6px solid white;border-radius:22px 22px 35px 35px;position:relative;box-shadow:0 12px 22px #2c58a52a}.slot{position:absolute;left:26px;top:29px;background:#163b87;width:72px;height:52px;border-radius:18px}.knob{position:absolute;right:34px;top:18px;width:65px;height:65px;border:7px solid #fff1af;border-radius:50%;background:var(--yellow);box-shadow:0 4px 0 #183b8f}.knob:after{content:'';position:absolute;background:#fff6ce;left:21px;top:3px;width:9px;height:43px;border-radius:5px}.mix .knob{animation:turn .5s linear infinite}@keyframes turn{to{transform:rotate(360deg)}}.draw{width:100%;border:0;border-radius:18px;background:var(--yellow);padding:18px;font-size:23px;font-weight:900;color:#493a12;box-shadow:0 5px 0 #e6b630;margin:24px 0 15px;transition:transform .1s}.draw:hover:not(:disabled){transform:translateY(-2px)}.draw:disabled{cursor:default;opacity:.7}.options{font-size:14px;color:#586a83;display:flex;gap:8px;align-items:center}.options input{width:18px;height:18px;accent-color:var(--blue)}.count{font-size:13px;color:#687b94;margin-top:14px}.stage{border:2px solid white;border-radius:32px;background:#fff;box-shadow:0 16px 50px #35598e0c;min-height:440px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px;position:relative;overflow:hidden}.result-label{font-size:13px;letter-spacing:.1em;font-weight:bold;color:var(--blue);background:#eef4ff;border-radius:50px;padding:8px 16px}.emoji{font-size:75px;margin:20px 0 10px;line-height:1.2}.title{font-size:clamp(30px,3.5vw,57px);line-height:1.35;letter-spacing:-.05em;font-weight:900;margin:10px 0 20px;word-break:keep-all}.questions{font-size:clamp(17px,1.7vw,25px);line-height:1.8;color:#5d6e85;word-break:keep-all}.pop{animation:pop .5s cubic-bezier(.2,1.5,.5,1)}@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}.thinking{margin:18px 0 0;padding:16px 23px;border-radius:18px;background:#eaf2ff;color:#284c84;font-size:16px;text-align:center;line-height:1.6}.history-wrap{margin:23px 0 0}.history-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#63758d}.history{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px;min-height:35px}.chip{background:white;border:1px solid #dce6f4;border-radius:40px;padding:9px 15px;font-size:13px}.muted{font-size:13px;color:#8390a1;padding:8px 0}footer{text-align:center;color:#8593a6;font-size:12px;padding:16px}.confetti{position:absolute;top:-20px;width:10px;height:18px;animation:fall 1.5s ease-in forwards;pointer-events:none}@keyframes fall{to{transform:translateY(620px) rotate(700deg);opacity:0}}@media(min-width:1500px){main{padding-top:28px}.stage{min-height:520px}}@media(max-width:850px){header{padding:18px}.brand{font-size:12px}.small{padding:9px;font-size:12px}main{padding:8px 18px}.layout{grid-template-columns:1fr}.machine-side{padding:15px}.machine{transform:scale(.72);margin:-40px 0}.draw{max-width:400px}.stage{min-height:350px;padding:26px 18px}.intro p{font-size:14px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}} 
</style></head><body>
<header><div class="brand">☀️ JOYSSAM · 날씨 뉴스 교실</div><div class="tools"><button class="small" id="sound" aria-pressed="true">🔊 소리 켜짐</button><button class="small" id="full">⛶ 전체 화면</button><button class="small" id="reset">↺ 처음부터</button></div></header>
<main><section class="intro"><div class="eyebrow">활동 3 · 날씨를 생활에 활용하기</div><h1>오늘은 <span>어떤 날?</span></h1><p>친구들의 날씨 뉴스를 듣고, 뽑힌 상황에 맞게 계획을 세워 보세요.</p></section>
<div class="layout"><section class="machine-side" aria-label="상황 뽑기 기계"><div class="machine" id="machine"><div class="globe" id="globe" aria-hidden="true"></div><div class="base"><div class="slot"></div><div class="knob"></div></div></div><button class="draw" id="draw">상황 뽑기 ✨</button><label class="options"><input id="unique" type="checkbox" checked>같은 상황은 다시 뽑지 않기</label><div class="count" id="count"></div></section>
<section class="stage" id="stage" aria-label="뽑힌 상황"><div id="result" role="status" aria-live="polite" aria-atomic="true"><div class="result-label" id="badge">나만의 날씨 맞춤 계획</div><div class="emoji" id="emoji">🎁</div><h2 class="title" id="title">어떤 날이 나올까요?</h2><div class="questions" id="questions">상황 뽑기 버튼을 눌러 주세요.<br>날씨에 따라 무엇을 바꾸면 좋을지 생각해 봐요.</div></div></section></div>
<div class="thinking">💬 <strong>“뉴스에서 __________라고 했으므로, 우리는 __________하겠습니다.”</strong></div>
<section class="history-wrap"><div class="history-top"><strong>지금까지 뽑은 상황</strong><span id="total">총 8가지 상황</span></div><div id="history" class="history"><span class="muted">뽑은 상황이 이곳에 차례로 모여요.</span></div></section>
</main><footer>by Joyssam</footer>
<script>
'use strict';
const situations=[
{emoji:'🚌',title:'현장체험학습 가는 날',q:['옷과 준비물은 무엇이 필요할까요?','야외 활동이 어렵다면 어떻게 할까요?']},
{emoji:'🏃',title:'체육대회 하는 날',q:['경기 시간과 장소를 바꾸면 좋을까요?','쉬는 시간에는 무엇이 필요할까요?']},
{emoji:'🧺',title:'공원으로 소풍 가는 날',q:['어디에 자리를 잡으면 좋을까요?','무엇을 챙기면 좋을까요?']},
{emoji:'🏕️',title:'가족과 캠핑 가는 날',q:['잠잘 때 무엇이 필요할까요?','야외에서 무엇을 조심해야 할까요?']},
{emoji:'🚲',title:'친구와 자전거 타기로 한 날',q:['약속한 시간과 장소가 괜찮을까요?','계획을 어떻게 바꾸면 좋을까요?']},
{emoji:'💦',title:'물놀이하러 가는 날',q:['물놀이를 해도 괜찮을까요?','어떤 날씨 변화에 주의해야 할까요?']},
{emoji:'🎪',title:'학교 운동장에서 바자회를 여는 날',q:['물건과 안내판이 날리거나 젖지 않게','어떻게 준비하면 좋을까요?']},
{emoji:'🌱',title:'학교 텃밭을 가꾸는 날',q:['물을 줘야 할까요? 언제 작업하면 좋을까요?','식물을 어떻게 보호하면 좋을까요?']}
];
const $=id=>document.getElementById(id);let used=new Set(),history=[],busy=false,sound=true,ctx=null,timer=null,ticker=null;
const colors=['#ffda67','#a8d5ff','#cbbcff','#ffb3c7','#9ce2cc','#9ce0ef','#ffc79c','#bedda1'];
situations.forEach((s,i)=>{let b=document.createElement('span');b.className='ball';b.textContent=s.emoji;b.dataset.index=i;b.style.cssText=`--c:${colors[i]};--x:${[16,80,145,202,30,95,158,206][i]}px;--y:${[152,173,155,174,92,107,92,108][i]}px;--dx:${i%2?'-35':'30'}px;--dy:${-60-(i%3)*15}px;--d:${-i*.07}s`;$('globe').append(b)});
function update(){const left=8-used.size;document.querySelectorAll('.ball').forEach((b,i)=>b.classList.toggle('used',$('unique').checked&&used.has(i)));$('count').textContent=$('unique').checked?`남은 상황 ${left} / 8`:'중복 허용 · 총 8가지 상황';$('draw').disabled=busy||($('unique').checked&&left===0);$('draw').textContent=busy?'공을 섞고 있어요…':($('unique').checked&&left===0?'모두 뽑았어요!':'상황 뽑기 ✨');$('unique').disabled=busy;$('reset').disabled=busy}
async function initAudio(){if(!sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!ctx)ctx=new AC();if(ctx.state==='suspended')await ctx.resume()}catch(e){ctx=null}}
function tone(f,d=.07,type='sine',when=0,vol=.055){if(!sound||!ctx||ctx.state!=='running')return;const t=ctx.currentTime+when,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+d+.02)}
function fanfare(){[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,.35,'sine',i*.13,.08))}
function randomIndex(n){if(window.crypto&&crypto.getRandomValues){let a=new Uint32Array(1),limit=4294967296-(4294967296%n);do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}return Math.floor(Math.random()*n)}
function celebrate(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<32;i++){const c=document.createElement('span');c.className='confetti';c.style.cssText=`left:${Math.random()*100}%;background:${colors[i%8]};animation-delay:${Math.random()*.35}s;transform:rotate(${i*31}deg)`;$('stage').append(c);setTimeout(()=>c.remove(),2100)}}
function reveal(i){const s=situations[i];used.add(i);history.push(i);$('badge').textContent=`${history.length}번째 뽑힌 상황`;$('emoji').textContent=s.emoji;$('title').textContent=s.title;$('questions').replaceChildren(...s.q.flatMap((q,j)=>j?[document.createElement('br'),document.createTextNode(q)]:[document.createTextNode(q)]));$('result').classList.remove('pop');void $('result').offsetWidth;$('result').classList.add('pop');$('history').replaceChildren(...history.map((n,j)=>{const c=document.createElement('span');c.className='chip';c.textContent=`${j+1}. ${situations[n].emoji} ${situations[n].title}`;return c}));busy=false;$('machine').classList.remove('mix');update();fanfare();celebrate();if($('unique').checked&&used.size===8)$('count').textContent='8개 상황을 모두 뽑았어요. ‘처음부터’를 눌러 다시 시작하세요.'}
$('draw').addEventListener('click',async()=>{if(busy)return;const pool=situations.map((_,i)=>i).filter(i=>!$('unique').checked||!used.has(i));if(!pool.length)return;busy=true;update();await initAudio();$('machine').classList.add('mix');$('badge').textContent='두근두근! 어떤 상황이 나올까요?';$('title').textContent='공을 섞고 있어요…';$('emoji').textContent='🎲';$('questions').textContent='날씨를 생각하며 계획을 세울 준비!';ticker=setInterval(()=>tone(240+Math.random()*380,.045,'triangle'),135);timer=setTimeout(()=>{clearInterval(ticker);reveal(pool[randomIndex(pool.length)])},2300)});
$('unique').addEventListener('change',update);
$('sound').addEventListener('click',()=>{sound=!sound;$('sound').textContent=sound?'🔊 소리 켜짐':'🔇 소리 꺼짐';$('sound').setAttribute('aria-pressed',String(sound))});
$('reset').addEventListener('click',()=>{if(busy)return;used.clear();history=[];$('badge').textContent='나만의 날씨 맞춤 계획';$('emoji').textContent='🎁';$('title').textContent='어떤 날이 나올까요?';$('questions').textContent='상황 뽑기 버튼을 눌러 주세요. 날씨에 따라 무엇을 바꾸면 좋을지 생각해 봐요.';$('history').innerHTML='<span class="muted">뽑은 상황이 이곳에 차례로 모여요.</span>';update()});
$('full').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else $('full').textContent='브라우저의 전체 화면을 이용해 주세요'}catch(e){$('full').textContent='F11로 전체 화면'}});
document.addEventListener('fullscreenchange',()=>{$('full').textContent=document.fullscreenElement?'⛶ 전체 화면 해제':'⛶ 전체 화면'});update();
</script></body></html>
